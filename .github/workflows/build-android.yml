name: build-android

# Builds an installable arm64 APK of Eglantine (nx2 branch) for Android handhelds.
# Run it from the Actions tab of your fork: "build-android" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NUM_JOBS: 4
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships the Android SDK; just add what this project needs.
      - name: Install NDK, platform and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.5"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools

      - name: Build APK
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b "${{ inputs.build_type }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-android-arm64-${{ inputs.build_type }}
          path: |
            artifacts/*.apk
            src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
